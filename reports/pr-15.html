<div id="app"></div>

<script>
const D = JSON.parse(document.getElementById("report-data").textContent);
/* Number and dollar formatting, shared by every report and dashboard.
   Costs read as whole dollars — cents are noise at this scale. usd() emits a
   half-transparent sign so the digits carry the line; usdPlain() is the same
   number for places that can't hold markup (title attributes, etc.). */
const fmt = (n) => (typeof n === "number" ? n.toLocaleString("en-US") : "—");
const usdPlain = (n) =>
  (typeof n === "number" ? "$" + Math.round(n).toLocaleString("en-US") : "—");
const usd = (n) => (typeof n === "number"
  ? '<span class="usd-sign">$</span>' + Math.round(n).toLocaleString("en-US")
  : "—");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const revClass = (r) => "rev-" + String(r).toLowerCase();
const statusPill = (s) =>
  s === "fixed"
    ? '<span class="pill fixed">FIXED ✔</span>'
    : s === "rebutted"
      ? '<span class="pill rebutted">REBUTTED ⚔</span>'
      : '<span class="pill open-issue">OPEN ●</span>';
const sev = (s) => `<b class="sev-${esc(s)}">[${esc(s)}]</b>`;
/* ⚠️ Finding text is prose written by an agent about code, so it contains
   angle brackets — "prefers a <table>", "Array<T>", "<div> is unclosed". Dropped
   into the template raw, one such title opened a real <table> and the browser
   swallowed every panel after it: rounds nested inside rounds, the scoreboard
   inside a finding card. Everything from the JSON is escaped now; `backticks`
   are the one bit of markup the fields may carry, and they become <code>. */
const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

const totals = D.sessions.reduce(
  (a, s) => ({
    inp: a.inp + (s.inputTokens ?? 0),
    out: a.out + (s.outputTokens ?? 0),
    cr: a.cr + (s.cacheReadTokens ?? 0),
    cw: a.cw + (s.cacheWriteTokens ?? 0),
    cost: typeof s.costUSD === "number" ? a.cost + s.costUSD : a.cost,
    unpriced: a.unpriced + (typeof s.costUSD === "number" ? 0 : 1),
  }),
  { inp: 0, out: 0, cr: 0, cw: 0, cost: 0, unpriced: 0 }
);
/* ⚠️ Nothing measured must not read as zero measured — the footnote below says
   so and the totals row was contradicting it. `null` where no session carried
   a figure, which `fmt`/`usd` render as an em dash. */
const anyPriced = D.sessions.some((s) => typeof s.costUSD === "number");
const some = (k) => D.sessions.some((s) => typeof s[k] === "number");
const T = {
  inp: some("inputTokens") ? totals.inp : null,
  out: some("outputTokens") ? totals.out : null,
  cr: some("cacheReadTokens") ? totals.cr : null,
  cw: some("cacheWriteTokens") ? totals.cw : null,
  cost: anyPriced ? totals.cost : null,
};

const fixPct = D.score.found
  ? Math.round((D.score.fixed / D.score.found) * 100) : 0;

/* Per-reviewer value scoreboard. "Blind spots caught" is the column that
   answers the actual question: which subscription is earning its keep. */
const board = {};
D.rounds.forEach((r) =>
  r.findings.forEach((f) => {
    /* A card may stand for several findings of the same shape — nine stale
       comments, three clocks — so it can declare `count`. Without it the
       scoreboard would disagree with the headline, and the reader would have
       to work out which number to believe. */
    const n = f.count ?? 1;
    const b = (board[f.reviewer] ??= { found: 0, fixed: 0, missed: 0 });
    b.found += n;
    if (f.status === "fixed") b.fixed += n;
    if (f.wouldHaveMissed) b.missed += n;
  })
);
const blindTotal = Object.values(board).reduce((a, b) => a + b.missed, 0);
const boardRows = Object.entries(board)
  .sort((a, b) => b[1].missed - a[1].missed || b[1].fixed - a[1].fixed)
  .map(([rev, b], i) => `
    <tr class="board-row">
      <td>${["🥇", "🥈", "🥉"][i] ?? "•"}</td>
      <td class="board-name ${revClass(rev)}">${esc(rev)}</td>
      <td class="num-cell">${b.found}</td>
      <td class="num-cell" style="color:var(--green)">${b.fixed}</td>
      <td class="num-cell blindspot">${b.missed} 👁</td>
    </tr>`).join("");

/* --- the WHEN strip -------------------------------------------------------
   Restored 2026-09-11 to the pre-2026-09-09 design, by request. The folded
   project lanes read as aggregate bars and hid the one thing worth scanning:
   what each session was actually about. One lane per session, titled, is the
   version that gets read. `esc` comes from _money.js.
   ---------------------------------------------------------------------- */
const TL = D.timeline;
const HOUR = 3600e3;
const tlFmtTime = (ms) => new Date(ms).toLocaleTimeString("en-US",
  { hour: "numeric", minute: "2-digit" }).toLowerCase();
const tlFmtDur = (ms) => {
  const m = Math.max(0, Math.round(ms / 60e3));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min`;
};
const tlAgo = (ms) => {
  const m = Math.round(ms / 60e3);
  if (m < 1) return "still going";
  if (m < 60) return `stopped ${m} min ago`;
  if (m < 48 * 60) return `stopped ${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min ago`;
  return `stopped ${Math.round(m / 1440)} d ago`;
};
const tlK = (n) => typeof n !== "number" ? "—"
  : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(n);
const tlModel = (m) => (m ?? "").replace(/^claude-/, "").replace(/-\d{8}$/, "");
/* One hue per project so the lanes read as families, not a rainbow. */
const tlPalette = ["var(--cyan)", "var(--magenta)", "var(--purple)", "var(--green)", "var(--orange)"];
const tlProjects = TL ? [...new Set(TL.sessions.map((s) => s.project))] : [];
const tlColor = (p) => tlPalette[tlProjects.indexOf(p) % tlPalette.length];

function tlWindow() {
  const hours = TL.windowHours ?? 24;
  const gen = Date.parse(TL.generatedAt);
  const now = Date.now();
  /* Slide with the clock while the report is fresh; freeze once it is a
     record of a day that has passed, or the sessions would drift off the left. */
  const end = now - gen < 12 * HOUR ? Math.max(now, gen) : gen;
  return { start: end - hours * HOUR, end, hours, sliding: end !== gen, now };
}

function tlSegs(segs, w, color, extra = "") {
  const span = w.end - w.start;
  return segs.map(([a, b]) => {
    const l = Math.max(0, (Date.parse(a) - w.start) / span * 100);
    const r = Math.min(100, (Date.parse(b) - w.start) / span * 100);
    if (r <= 0 || l >= 100) return "";
    return `<div class="tl-seg" style="left:${l.toFixed(2)}%;width:${Math.max(0.3, r - l).toFixed(2)}%;background:${color};${extra}"></div>`;
  }).join("");
}

function tlRender() {
  if (!TL || !TL.work) return "";
  const w = tlWindow();
  const ticks = [];
  const first = Math.ceil(w.start / (3 * HOUR)) * 3 * HOUR;
  for (let t = first; t <= w.end; t += 3 * HOUR) {
    const pct = (t - w.start) / (w.end - w.start) * 100;
    ticks.push(`<span class="tl-tick" style="left:${pct.toFixed(2)}%">${tlFmtTime(t)}</span>`);
  }
  const nowPct = (w.now - w.start) / (w.end - w.start) * 100;
  const nowMark = nowPct >= 0 && nowPct <= 100
    ? `<div class="tl-now" style="left:${nowPct.toFixed(2)}%" title="now"></div>` : "";
  const ws = Date.parse(TL.work.start), we = Date.parse(TL.work.end);
  /* The PR's band is the work span, textured by the activity of the session
     that did it when that session is in the list; a plain bar otherwise. */
  const own = (TL.sessions ?? []).filter((s) => s.id && (TL.work.sessionIds ?? []).includes(s.id));
  const workSegs = own.length
    ? own.flatMap((s) => s.segments).filter(([a, b]) => Date.parse(b) >= ws && Date.parse(a) <= we)
    : [[TL.work.start, TL.work.end]];
  const lanes = (TL.sessions ?? []).map((s) => `
    <div class="tl-name" title="${esc(s.title)} — ${esc(s.id ?? "")}">
      <span class="tl-chip" style="color:${tlColor(s.project)};border-color:${tlColor(s.project)}">${esc(s.project)}</span>
      <span class="tl-chip">${esc(tlModel(s.model)) || "?"}</span>
      ${esc(s.title)}
    </div>
    <div class="tl-lane">${tlSegs(s.segments ?? [], w, tlColor(s.project))}${s.active ? "" : ""}</div>
    <div class="tl-spend"><span style="color:var(--dim)">${tlK(s.tokens)}</span>
      &nbsp;<b style="color:var(--gold)">${usd(s.costUSD)}</b></div>`).join("");
  const spend = (TL.sessions ?? []).reduce((a, s) => a + (typeof s.costUSD === "number" ? s.costUSD : 0), 0);
  const tokens = (TL.sessions ?? []).reduce((a, s) => a + (s.tokens ?? 0), 0);
  return `
<div class="panel" id="tl" style="margin-bottom:12px">
  <div class="round-hd" style="color:var(--cyan);text-align:left;margin-bottom:10px">
    🕒 When
    <span style="color:var(--dim);font-weight:400;letter-spacing:0;text-transform:none;margin-left:8px">
      this PR's work ran <b style="color:var(--text)">${tlFmtTime(ws)} → ${tlFmtTime(we)}</b>
      · <b style="color:var(--text)">${tlFmtDur(we - ws)}</b>
      · <span class="tl-live" id="tl-ago">${tlAgo(w.now - we)}</span>
    </span>
  </div>
  <div class="tl-grid">
    <div class="tl-name" style="color:var(--dim)">24 h ${w.sliding ? "ending now" : "ending " + tlFmtTime(w.end)}</div>
    <div class="tl-axis">${ticks.join("")}</div>
    <div></div>
    <div class="tl-name"><b style="color:var(--cyan)">#${D.pr.number}</b> this PR</div>
    <div class="tl-lane tl-work" style="position:relative;overflow:visible">
      <div class="tl-seg" style="left:${Math.max(0,(ws-w.start)/(w.end-w.start)*100).toFixed(2)}%;width:${Math.max(0.3,Math.min(100,(we-w.start)/(w.end-w.start)*100)-Math.max(0,(ws-w.start)/(w.end-w.start)*100)).toFixed(2)}%;background:#1f4a55;box-shadow:none"></div>
      ${tlSegs(workSegs, w, "var(--cyan)")}${nowMark}
    </div>
    <div class="tl-spend" style="color:var(--dim)">${TL.sessions?.length ?? 0} session${(TL.sessions?.length ?? 0) === 1 ? "" : "s"} in window</div>
    ${lanes}
  </div>
  <div class="tl-caption">
    Every session on this machine active in the window, lanes lit where messages
    were exchanged (a gap over 20 min breaks the line). Tokens are billable work
    inside the window; dollars count cache reads too, list price.
    Window spend: <b style="color:var(--text)">${tlK(tokens)}</b> ·
    <b class="glow" style="color:var(--gold)">${usd(spend)}</b>
  </div>
</div>`;
}

/* The project, loud, in the header: a page that says "#8" without saying which
   repo is a page the reader has to place. From `pr.repo` when set, else the
   owner/repo segment of the PR's URL. */
const repoName = D.pr.repo
  ?? ((D.pr.url ?? "").match(/github\.com\/([^/]+\/[^/]+)/) ?? [])[1]
  ?? "";

document.getElementById("app").innerHTML = `
<header>
  <div style="min-width:0">
    <h1 class="glow" style="color:var(--cyan)">⚔ PR REVIEW ARENA
      <span style="color:var(--gold);margin-left:10px">${esc(repoName)}</span></h1>
    <div style="color:var(--dim);font-size:12px">
      <a href="${esc(D.pr.url)}" style="color:var(--cyan)">${esc(repoName)}#${D.pr.number}</a>
      · ${esc(D.pr.title)} · ${esc(D.pr.branch)} · ${esc(D.pr.date)}
    </div>
  </div>
  <div style="text-align:center;flex:none">
    <div class="glow" style="font-size:32px;font-weight:900;color:var(--gold);line-height:1">
      ${esc(D.score.grade)}
    </div>
    <span class="badge" style="color:var(--green)">${esc(D.pr.verdict)}</span>
  </div>
</header>

${tlRender()}

<div class="panel stats">
  <div class="stat">
    <div class="num" style="color:var(--magenta)">${D.score.found}</div>
    <div class="lbl">Findings</div>
  </div>
  <div class="stat">
    <div class="num" style="color:var(--green)">${D.score.fixed}</div>
    <div class="lbl">Fixed · ${fixPct}%</div>
    <div class="bar-wrap"><div class="bar"
      style="width:${fixPct}%;background:var(--green)"></div></div>
  </div>
  <div class="stat">
    <div class="num" style="color:var(--orange)">${D.score.rebutted}</div>
    <div class="lbl">Rebutted</div>
  </div>
  <div class="stat">
    <div class="num blindspot">${blindTotal}</div>
    <div class="lbl">Blind spots 👁</div>
  </div>
</div>

<div class="rounds" style="margin-bottom:10px">
${D.rounds.map((r, i) => `
  <div class="panel">
    <div class="round-hd" style="color:var(--${["cyan","gold","magenta"][i % 3]})">
      ${esc(r.label)} — ${r.findings.reduce((s, f) => s + (f.count ?? 1), 0)} finding${r.findings.reduce((s, f) => s + (f.count ?? 1), 0) === 1 ? "" : "s"}
    </div>
    ${r.findings.map((f) => `
      <details>
        <summary style="font-size:12px">
          ${sev(f.severity)}
          <span class="${revClass(f.reviewer)}">${esc(f.reviewer)}</span>
          <span class="f-title">${md(f.title)}</span>
          ${f.wouldHaveMissed ? '<span class="missed-flag" title="Claude would have missed this">👁</span>' : ""}
          ${statusPill(f.status)}
        </summary>
        <div class="body">
          <p style="color:var(--dim);font-size:12px">${md(f.detail)}</p>
          <div class="finding-line">
            <span class="rev-claude">🤖 Claude:</span> ${md(f.claudeResponse)}
            <span class="conf">confidence ${esc(f.confidence)}%</span>
          </div>
        </div>
      </details>
    `).join("") || '<div style="color:var(--dim);text-align:center;font-size:12px">— clean round —</div>'}
  </div>
`).join("")}
</div>

<div class="panel" style="margin-bottom:10px">
  <div class="round-hd" style="color:var(--gold)">🏅 Reviewer Value Scoreboard</div>
  <table>
    <tr><th></th><th>Reviewer</th>
      <th class="num-cell">Findings</th>
      <th class="num-cell">Fixed</th>
      <th class="num-cell">Blind Spots Caught 👁</th></tr>
    ${boardRows}
  </table>
</div>

<details class="panel" style="padding:0">
  <summary style="padding:12px 14px">
    💰 <span style="color:var(--gold)">TOKEN LEDGER</span>
    <span style="flex:1"></span>
    <span class="glow" style="color:var(--gold)">${usd(T.cost)}${anyPriced ? " this PR" : " not yet priced"}</span>
  </summary>
  <div class="body">
    <table>
      <tr><th>Session</th><th>Model</th>
        <th class="num-cell">Input</th><th class="num-cell">Output</th>
        <th class="num-cell">Cache Read</th><th class="num-cell">Cache Write</th>
        <th class="num-cell">Cost</th></tr>
      ${D.sessions.map((s) => `
        <tr><td>${esc(s.name)}</td><td style="color:var(--dim)">${esc(s.model)}</td>
          <td class="num-cell">${fmt(s.inputTokens)}</td>
          <td class="num-cell">${fmt(s.outputTokens)}</td>
          <td class="num-cell" style="color:var(--cyan)">${fmt(s.cacheReadTokens)}</td>
          <td class="num-cell" style="color:var(--purple)">${fmt(s.cacheWriteTokens)}</td>
          <td class="num-cell ${typeof s.costUSD === "number" ? "" : "unmeasured"}"
              style="${typeof s.costUSD === "number" ? "color:var(--gold)" : ""}">${usd(s.costUSD)}</td></tr>
      `).join("")}
      <tr style="font-weight:800">
        <td colspan="2">TOTAL</td>
        <td class="num-cell">${fmt(T.inp)}</td>
        <td class="num-cell">${fmt(T.out)}</td>
        <td class="num-cell" style="color:var(--cyan)">${fmt(T.cr)}</td>
        <td class="num-cell" style="color:var(--purple)">${fmt(T.cw)}</td>
        <td class="num-cell glow" style="color:var(--gold)">${usd(T.cost)}</td>
      </tr>
    </table>
    ${totals.unpriced > 0 ? `<p class="unmeasured" style="font-size:11px;margin-top:8px">
      ${totals.unpriced} session${totals.unpriced === 1 ? " has" : "s have"} no cost recorded — run
      <code>/cost</code> and fill <code>costUSD</code>. Shown as “—” rather than $0,
      because a zero would be a measurement nobody took.</p>` : ""}
  </div>
</details>

<footer>
  🏆 Project running total:
  <b class="glow" style="color:var(--gold)">${usd(D.projectRunningTotalUSD)}</b>
</footer>`;

/* The "stopped N min ago" figure and the now-marker tick live. Re-rendering
   the strip is cheaper than tracking its parts, and nothing else on the page
   moves, so only that panel is replaced. */
if (TL && TL.work) {
  setInterval(() => {
    const el = document.getElementById("tl");
    if (!el) return;
    const tmp = document.createElement("div");
    tmp.innerHTML = tlRender();
    el.replaceWith(tmp.firstElementChild);
  }, 30e3);
}
</script>
</body>
